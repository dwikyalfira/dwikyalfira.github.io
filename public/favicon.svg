<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- same gradient as the header logo: radial-gradient(circle at 75% 85%, #ff3d7f, #f3efd0 40%, #1f4fb4 78%) -->
    <radialGradient id="g" cx="75%" cy="85%" r="113%" fx="75%" fy="85%">
      <stop offset="0" stop-color="#ff3d7f"/>
      <stop offset=".40" stop-color="#f3efd0"/>
      <stop offset=".78" stop-color="#1f4fb4"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#g)"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#e0302b" stroke-width="5"/>
</svg>
